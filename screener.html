<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zizo Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--bg2:#0d1220;--bg3:#111827;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.12);--txt:#e2e8f0;--txt2:#64748b;--txt3:#334155;--green:#22d3a0;--red:#f43f5e;--amber:#f59e0b;--purple:#8b5cf6;--blue:#38bdf8;--accent:#22d3a0;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:13px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 40px;}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--line2);margin-bottom:20px;}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:16px;}
.clock{font-size:12px;color:var(--txt2);letter-spacing:1px;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.updated{font-size:11px;color:var(--txt3);}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:4px;border:1px solid var(--line2);background:transparent;color:var(--txt2);cursor:pointer;transition:all .15s;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.active{background:var(--accent);color:#080c14;border-color:var(--accent);}
.tab.active.red{background:var(--red);border-color:var(--red);color:#fff;}
.tab.active.blue{background:var(--blue);border-color:var(--blue);color:#080c14;}
.sep{flex:1;}
.search-wrap{position:relative;}
.search-wrap input{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 10px 7px 30px;border-radius:4px;width:160px;outline:none;transition:border .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:15px;}
.refresh-btn{background:transparent;border:1px solid var(--line2);color:var(--txt2);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 12px;border-radius:4px;cursor:pointer;transition:all .15s;letter-spacing:1px;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn.loading{opacity:.5;pointer-events:none;}
.legend{display:flex;gap:20px;margin-bottom:14px;font-size:11px;color:var(--txt3);letter-spacing:.5px;}
.legend-item{display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
.stat-label{font-size:10px;color:var(--txt3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.stat-val{font-size:18px;font-weight:600;color:var(--txt);}
.stat-val.green{color:var(--green);}
.stat-val.red{color:var(--red);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt3);padding:8px 12px;text-align:left;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap;transition:color .1s;}
thead th:hover{color:var(--txt2);}
thead th.sorted{color:var(--accent);}
thead th.r,td.r{text-align:right;}
tbody tr{border-bottom:1px solid var(--line);transition:background .1s;}
tbody tr:hover td{background:var(--bg2);}
tbody tr.portfolio-row td{background:rgba(139,92,246,.06);}
tbody tr.portfolio-row:hover td{background:rgba(139,92,246,.12);}
tbody tr:last-child{border-bottom:none;}
td{padding:9px 12px;white-space:nowrap;}
.sym{font-weight:600;font-size:13px;color:#fff;}
.name-td{color:var(--txt2);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
.price-td{color:#fff;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.vol-td{color:var(--txt2);font-size:12px;}
.exch-td{color:var(--txt3);font-size:11px;}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;display:inline-block;}
.badge-portfolio{background:rgba(139,92,246,.25);color:#a78bfa;border:1px solid rgba(139,92,246,.4);}
.badge-large{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.2);}
.badge-mid{background:rgba(34,211,160,.1);color:#6ee7c8;border:1px solid rgba(34,211,160,.2);}
.badge-penny{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.25);}
.analyze-btn{font-size:10px;padding:3px 9px;border-radius:3px;border:1px solid var(--line2);background:transparent;color:var(--txt3);cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:all .12s;letter-spacing:.5px;}
.analyze-btn:hover{border-color:var(--accent);color:var(--accent);}
.state{padding:30px 0;text-align:center;color:var(--txt3);font-size:13px;}
.state.error{color:var(--red);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:24px 28px;width:460px;max-width:90vw;transform:translateY(10px);transition:transform .2s;}
.modal-bg.open .modal{transform:translateY(0);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-sym{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;}
.modal-close{background:none;border:none;color:var(--txt3);font-size:20px;cursor:pointer;padding:0 4px;}
.modal-close:hover{color:var(--txt);}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;}
.modal-row:last-child{border:none;}
.modal-row .lbl{color:var(--txt3);}
.modal-row .val{font-weight:500;}
@media(max-width:700px){.stats-bar{grid-template-columns:1fr 1fr;}.name-td{display:none;}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">ZIZO <span>SCREENER</span></div>
  <div class="header-right">
    <div class="clock"><span class="live-dot"></span><span id="clock">--:--:--</span></div>
    <div class="updated" id="updated">not loaded</div>
  </div>
</header>
<div class="stats-bar">
  <div class="stat-card"><div class="stat-label">Top Gainer</div><div class="stat-val green" id="s-topg">—</div></div>
  <div class="stat-card"><div class="stat-label">Top Loser</div><div class="stat-val red" id="s-topl">—</div></div>
  <div class="stat-card"><div class="stat-label">Portfolio in gainers</div><div class="stat-val" id="s-port">—</div></div>
  <div class="stat-card"><div class="stat-label">Loaded</div><div class="stat-val" id="s-count">—</div></div>
</div>
<div class="toolbar">
  <button class="tab active" id="btn-gainers" onclick="switchTab('gainers',this)">▲ Gainers</button>
  <button class="tab" id="btn-losers" onclick="switchTab('losers',this)">▼ Losers</button>
  <button class="tab" id="btn-actives" onclick="switchTab('actives',this)">◈ Actives</button>
  <div class="sep"></div>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="Filter symbol…" oninput="renderTable()"></div>
  <button class="refresh-btn" id="refreshBtn" onclick="refresh()">↺ REFRESH</button>
</div>
<div class="legend">
  <div class="legend-item"><span class="dot" style="background:#8b5cf6"></span>Portfolio</div>
  <div class="legend-item"><span class="dot" style="background:#38bdf8"></span>Large cap ($5B+)</div>
  <div class="legend-item"><span class="dot" style="background:#22d3a0"></span>Mid cap</div>
  <div class="legend-item"><span class="dot" style="background:#f59e0b"></span>Penny (&lt;$5)</div>
</div>
<div class="table-wrap" id="tableWrap"><div class="state"><span class="spinner"></span>Loading…</div></div>
</div>
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-sym" id="m-sym">—</div><div style="color:var(--txt2);font-size:12px;margin-top:2px" id="m-name">—</div></div>
      <button class="modal-close" onclick="document.getElementById('modalBg').classList.remove('open')">✕</button>
    </div>
    <div id="m-rows"></div>
  </div>
</div>
<script>
const PORTFOLIO=new Set(["IREN","HIVE","WULF","RIOT","RKLB","NVDA","ANET","NOK","MU","TSM","GOOGL","RZLV","NBIS","ISWD","FLY","MNTS","ALHPI"]);
const SCRID={gainers:"day_gainers",losers:"day_losers",actives:"most_actives"};
let allData={gainers:[],losers:[],actives:[]},currentTab="gainers",sortCol="pct",sortAsc=false;
function tickClock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
setInterval(tickClock,1000);tickClock();
async function fetchScreen(type){const url=`https://query1.finance.yahoo.com/v1/finance/screener/predefined/saved?formatted=false&scrIds=${SCRID[type]}&count=50&start=0`;const r=await fetch(url,{headers:{"Accept":"application/json","User-Agent":"Mozilla/5.0"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();return(d?.finance?.result?.[0]?.quotes||[]).map(q=>({symbol:q.symbol,name:(q.shortName||q.longName||q.symbol),price:q.regularMarketPrice,change:q.regularMarketChange,pct:q.regularMarketChangePercent,volume:q.regularMarketVolume,marketCap:q.marketCap,exchange:q.exchange||q.fullExchangeName||"—",dayHigh:q.regularMarketDayHigh,dayLow:q.regularMarketDayLow,yearHigh:q.fiftyTwoWeekHigh,yearLow:q.fiftyTwoWeekLow,pe:q.trailingPE,portfolio:PORTFOLIO.has(q.symbol),penny:(q.regularMarketPrice||0)<5,large:(q.marketCap||0)>=5e9}));}
async function loadAll(){setLoading(true);try{const[g,l,a]=await Promise.all([fetchScreen("gainers"),fetchScreen("losers"),fetchScreen("actives")]);allData={gainers:g,losers:l,actives:a};updateStats();renderTable();document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"})+" CET";}catch(e){document.getElementById("tableWrap").innerHTML=`<div class="state error">⚠ ${e.message}</div>`;}setLoading(false);}
function setLoading(v){const b=document.getElementById("refreshBtn");b.classList.toggle("loading",v);b.textContent=v?"↺ LOADING…":"↺ REFRESH";}
function updateStats(){const g=allData.gainers,l=allData.losers;if(g.length)document.getElementById("s-topg").textContent=g[0].symbol+" +"+g[0].pct.toFixed(1)+"%";if(l.length)document.getElementById("s-topl").textContent=l[0].symbol+" "+l[0].pct.toFixed(1)+"%";const p=allData.gainers.filter(r=>r.portfolio).length;document.getElementById("s-port").textContent=p>0?p+" ✓":"0";document.getElementById("s-port").className="stat-val "+(p>0?"green":"");document.getElementById("s-count").textContent=allData.gainers.length+" / "+allData.losers.length+" / "+allData.actives.length;}
function fmtVol(v){if(!v)return"—";if(v>=1e9)return(v/1e9).toFixed(1)+"B";if(v>=1e6)return(v/1e6).toFixed(1)+"M";if(v>=1e3)return(v/1e3).toFixed(0)+"K";return String(v);}
function fmtP(v){return v==null?"—":"$"+v.toFixed(2);}
function fmtPct(v){return v==null?"—":(v>=0?"+":"")+v.toFixed(2)+"%";}
function badgeHtml(r){if(r.portfolio)return'<span class="badge badge-portfolio">Portfolio</span>';if(r.large)return'<span class="badge badge-large">Large</span>';if(r.penny)return'<span class="badge badge-penny">Penny</span>';return'<span class="badge badge-mid">Mid</span>';}
function renderTable(){const q=(document.getElementById("searchInput")?.value||"").toLowerCase();let rows=allData[currentTab].filter(r=>!q||r.symbol.toLowerCase().includes(q)||r.name.toLowerCase().includes(q));rows.sort((a,b)=>{let va=a[sortCol]??(sortAsc?Infinity:-Infinity),vb=b[sortCol]??(sortAsc?Infinity:-Infinity);if(typeof va==="string"){va=va.toLowerCase();vb=(vb||"").toLowerCase();}return sortAsc?(va>vb?1:-1):(va<vb?1:-1);});if(!rows.length){document.getElementById("tableWrap").innerHTML='<div class="state">No results</div>';return;}const ar=sortAsc?" ↑":" ↓";const th=(k,l,c="")=>`<th class="${c}${sortCol===k?" sorted":""}" onclick="setSort('${k}')">${l}${sortCol===k?ar:""}</th>`;let html=`<table><thead><tr>${th("symbol","Symbol")}${th("name","Name")}<th>Cat</th>${th("price","Price","r")}${th("pct","%","r")}${th("change","Chg","r")}${th("volume","Volume","r")}${th("exchange","Exch")}<th></th></tr></thead><tbody>`;rows.forEach(r=>{const pos=(r.pct||0)>=0,pc=pos?"pos":"neg",rc=r.portfolio?" class=\"portfolio-row\"":"";html+=`<tr${rc}><td class="sym">${r.symbol}</td><td class="name-td">${r.name.slice(0,26)}</td><td>${badgeHtml(r)}</td><td class="r price-td">${fmtP(r.price)}</td><td class="r ${pc}">${fmtPct(r.pct)}</td><td class="r ${pc}">${r.change!=null?(pos?"+":"")+r.change.toFixed(2):"—"}</td><td class="r vol-td">${fmtVol(r.volume)}</td><td class="exch-td">${r.exchange}</td><td><button class="analyze-btn" onclick="openModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">▸ Detail</button></td></tr>`;});html+="</tbody></table>";document.getElementById("tableWrap").innerHTML=html;}
function setSort(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=col==="symbol"||col==="name";}renderTable();}
function switchTab(tab,btn){currentTab=tab;sortCol=tab==="actives"?"volume":"pct";sortAsc=tab==="losers";["gainers","losers","actives"].forEach(t=>{const b=document.getElementById("btn-"+t);b.classList.remove("active","red","blue");});btn.classList.add("active");if(tab==="losers")btn.classList.add("red");if(tab==="actives")btn.classList.add("blue");renderTable();}
async function refresh(){await loadAll();}
function openModal(r){document.getElementById("m-sym").textContent=r.symbol;document.getElementById("m-name").textContent=r.name;const rows=[["Price",fmtP(r.price),r.pct>=0?"pos":"neg"],["Change",fmtPct(r.pct)+" / "+(r.change>=0?"+":"")+( r.change||0).toFixed(2),r.pct>=0?"pos":"neg"],["Volume",fmtVol(r.volume),""],["Day range",fmtP(r.dayLow)+" – "+fmtP(r.dayHigh),""],["52w range",fmtP(r.yearLow)+" – "+fmtP(r.yearHigh),""],["Market cap",r.marketCap?"$"+(r.marketCap/1e9).toFixed(2)+"B":"—",""],["P/E",r.pe?r.pe.toFixed(1)+"×":"—",""],["Exchange",r.exchange,""],["Category",r.portfolio?"Portfolio":r.large?"Large cap":r.penny?"Penny":"Mid cap",""]];document.getElementById("m-rows").innerHTML=rows.map(([l,v,c])=>`<div class="modal-row"><span class="lbl">${l}</span><span class="val ${c}">${v}</span></div>`).join("");document.getElementById("modalBg").classList.add("open");}
function closeModal(e){if(e.target===document.getElementById("modalBg"))document.getElementById("modalBg").classList.remove("open");}
loadAll();
</script>
</body>
</html>
